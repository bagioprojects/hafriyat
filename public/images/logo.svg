<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 84" width="398" height="84" fill="none">
  <defs>
    <!-- Endüstriyel CAT Sarı Gradyan -->
    <linearGradient id="catYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#E5A700" />
    </linearGradient>
    
    <!-- Parlak Vurgu -->
    <linearGradient id="yellowHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFC000" />
    </linearGradient>

    <!-- Koyu Karbon Gradyan -->
    <linearGradient id="carbonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Kabin Camı Gradyanı -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gölge Filtresi -->
    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ======================================================================
       1. KEPÇE İKONU & ASİL ANTRASİT ROZET (Dengeli, Büyük ve Güçlü)
       ====================================================================== -->
  <g id="kepce-badge" filter="url(#logoShadow)">
    <!-- Asil Antrasit Rozet Kalkanı -->
    <rect x="2" y="2" width="80" height="80" rx="15" fill="#1F2427" stroke="#343D40" stroke-width="1.5" />
    <rect x="5.5" y="5.5" width="73" height="73" rx="12" stroke="url(#catYellow)" stroke-width="1.2" stroke-opacity="0.65" />

    <!-- Kepçe İllüstrasyonu (Rozet İçi: Tam Ortalı) -->
    <g transform="translate(0, 4)">
      <!-- Palet Takımı -->
      <rect x="14" y="52" width="46" height="14" rx="7" fill="#293133" stroke="url(#catYellow)" stroke-width="1.8" />
      <circle cx="23" cy="59" r="4" fill="#455054" stroke="url(#catYellow)" stroke-width="1" />
      <circle cx="31" cy="59" r="2.8" fill="#1F2427" />
      <circle cx="37" cy="59" r="4" fill="#455054" stroke="url(#catYellow)" stroke-width="1" />
      <circle cx="45" cy="59" r="2.8" fill="#1F2427" />
      <circle cx="51" cy="59" r="4" fill="#455054" stroke="url(#catYellow)" stroke-width="1" />

      <!-- Makine Gövdesi -->
      <path d="M18 50 L18 36 Q18 32 23 32 L38 32 L40 50 Z" fill="url(#catYellow)" stroke="#1F2427" stroke-width="1.2" />
      <line x1="22" y1="36" x2="22" y2="45" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" />
      <line x1="26" y1="36" x2="26" y2="45" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" />
      <line x1="30" y1="36" x2="30" y2="45" stroke="#78350F" stroke-width="1.2" stroke-linecap="round" />

      <!-- Operatör Kabini -->
      <path d="M31 32 L35 18 Q36 16 39 16 L49 16 Q51 16 52 18 L54 32 Z" fill="#1F2427" stroke="url(#catYellow)" stroke-width="1.2" />
      <path d="M37 19 L47 19 L49 30 L36 30 Z" fill="url(#glassGrad)" />
      <line x1="39" y1="21" x2="44" y2="28" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />

      <!-- Ana Bom -->
      <path d="M47 40 L59 21 Q61 18 64 20 L68 23 Q70 25 68 28 L53 46 Z" fill="url(#catYellow)" stroke="#1F2427" stroke-width="1" />
      <line x1="48" y1="44" x2="60" y2="27" stroke="#1F2427" stroke-width="2.5" stroke-linecap="round" />
      <line x1="48" y1="44" x2="57" y2="30" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

      <!-- Kazıcı Kol -->
      <path d="M65 24 L73 36 Q74 38 72 40 L69 41 Q67 40 66 38 L62 27 Z" fill="url(#yellowHighlight)" stroke="#1F2427" stroke-width="1" />
      <circle cx="65" cy="25" r="2" fill="#1F2427" stroke="#FFFFFF" stroke-width="0.8" />
      <circle cx="71" cy="38" r="2" fill="#1F2427" stroke="#FFFFFF" stroke-width="0.8" />

      <!-- Kepçe Kovası ve Dişleri -->
      <path d="M69 39 L78 43 Q82 46 80 52 L73 55 Q68 56 66 50 L67 42 Z" fill="url(#catYellow)" stroke="#1F2427" stroke-width="1.2" />
      <polygon points="78,48 83,50 80,52" fill="#FFFFFF" />
      <polygon points="76,51 81,54 77,55" fill="#FFFFFF" />
      <polygon points="77,53 81,57 77,56" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ======================================================================
       2. TİPOGRAFİ VE KURUMSAL MARKA METNİ (Büyük, Kusursuz Orantılı & Dolgun)
       ====================================================================== -->
  <g id="brand-text" transform="translate(92, 38)">
    <!-- Ana Marka Başlığı: İri, Heybetli ve Otoriter Tipografi -->
    <text font-family="'Barlow', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.015em">
      <tspan x="0" y="0" fill="#181C1F">ADEM </tspan>
      <tspan fill="#181C1F">HAFRİYAT</tspan>
    </text>

    <!-- Endüstriyel Alt Şerit (Tagline Rozeti - 302px Genişlik) -->
    <g transform="translate(0, 10)">
      <!-- Antrasit Zemin Rozeti -->
      <rect x="0" y="0" width="302" height="25" rx="5" fill="#181C1F" />
      <!-- Sol Taksi Sarısı Vurgu Çizgisi -->
      <rect x="0" y="0" width="6.5" height="25" rx="3" fill="url(#catYellow)" />
      
      <!-- Rozet İçi Metin: Tam Ortalı, Net ve Kristal Netliğinde -->
      <text x="154" y="17.2" text-anchor="middle" font-family="'Barlow', 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="900" fill="#FFC000" letter-spacing="0.08em">
        YALOVA KEPÇE &amp; FORKLİFT KİRALAMA
      </text>
    </g>
  </g>
</svg>
