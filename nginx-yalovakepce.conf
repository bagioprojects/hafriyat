# ==============================================================================
# Nginx Virtual Host Konfigürasyonu — Adem Hafriyat
# Domain: yalovakepcehafriyat.com.tr & www.yalovakepcehafriyat.com.tr
# Kurulum Yolu: /etc/nginx/sites-available/yalovakepcehafriyat.com.tr
# Aktifleştirme: sudo ln -s /etc/nginx/sites-available/yalovakepcehafriyat.com.tr /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP -> HTTPS Yönlendirmesi & ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name yalovakepcehafriyat.com.tr www.yalovakepcehafriyat.com.tr;

    # Let's Encrypt SSL Doğrulama Dizini
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Tüm HTTP İsteklerini HTTPS'e Yönlendir (301 Kalıcı Yönlendirme)
    location / {
        return 301 https://yalovakepcehafriyat.com.tr$request_uri;
    }
}

# 2. WWW -> NON-WWW HTTPS Yönlendirmesi (Kanonik Domain Tutarlılığı)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yalovakepcehafriyat.com.tr;

    # SSL Sertifika Yolları (Certbot Tarafından Otomatik Doldurulacaktır)
    ssl_certificate /etc/letsencrypt/live/yalovakepcehafriyat.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yalovakepcehafriyat.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yalovakepcehafriyat.com.tr$request_uri;
}

# 3. Ana HTTPS Sunucu Bloğu (Production Node.js Ters Proxy)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yalovakepcehafriyat.com.tr;

    # Web Kök Dizini (Statik dosyalara doğrudan erişim için)
    root /var/www/yalovakepce/public;

    # SSL Sertifika Yolları
    ssl_certificate /etc/letsencrypt/live/yalovakepcehafriyat.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yalovakepcehafriyat.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gelişmiş SSL Protokol & Güvenlik Ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Güvenlik Başlıkları (A+ SSL Labs Skoru)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Sıkıştırma (Core Web Vitals Hızlandırması)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Statik Varlıklar (Görseller, CSS, JS, Fontlar - 1 Yıl Agresif Önbellek)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @nodejs;
    }

    # Özel Dosyalar (Robots.txt, Sitemap, Favicon, LLMs.txt)
    location = /robots.txt {
        access_log off;
        log_not_found off;
        proxy_pass http://127.0.0.1:7450;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri @nodejs;
    }

    # Ana Node.js Ters Proxy Bloğu
    location / {
        try_files $uri @nodejs;
    }

    location @nodejs {
        proxy_pass http://127.0.0.1:7450;
        proxy_http_version 1.1;

        # WebSocket & Sürekli Bağlantı
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Gerçek Ziyaretçi IP Bilgileri
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout & Buffer Ayarları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Gizli Dosyaları Engelle (.git, .env vb.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
