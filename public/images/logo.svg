<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 84" width="430" height="84" fill="none">
  <defs>
    <!-- Endüstriyel CAT Sarı Gradyan -->
    <linearGradient id="catYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    
    <!-- Parlak Sarı Vurgu Gradyan -->
    <linearGradient id="yellowHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Koyu Karbon Gradyan -->
    <linearGradient id="carbonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Kabin Camı Gradyanı -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gölge Filtresi -->
    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ======================================================================
       KEPÇE / İŞ MAKİNESİ VEKTÖR ÇİZİMİ (X: 4 - 82, Y: 4 - 80)
       ====================================================================== -->
  <g id="kepce-icon" transform="translate(4, 3)" filter="url(#logoShadow)">
    <!-- 1. Palet / Alt Yürüyüş Takımı (Tracks Base) -->
    <rect x="6" y="54" width="48" height="15" rx="7.5" fill="url(#carbonDark)" stroke="url(#catYellow)" stroke-width="2.2" />
    
    <!-- Palet Tekerlekleri (Track Rollers) -->
    <circle cx="15" cy="61.5" r="4.5" fill="#334155" stroke="url(#catYellow)" stroke-width="1.2" />
    <circle cx="24" cy="61.5" r="3.2" fill="#0B0F19" />
    <circle cx="30" cy="61.5" r="4.5" fill="#334155" stroke="url(#catYellow)" stroke-width="1.2" />
    <circle cx="39" cy="61.5" r="3.2" fill="#0B0F19" />
    <circle cx="45" cy="61.5" r="4.5" fill="#334155" stroke="url(#catYellow)" stroke-width="1.2" />

    <!-- 2. Makine Gövdesi & Arka Motor Ağırlığı (Body & Counterweight) -->
    <path d="M10 52 L10 38 Q10 33 15 33 L32 33 L34 52 Z" fill="url(#catYellow)" stroke="#0B0F19" stroke-width="1.5" />
    <!-- Motor Izgaraları -->
    <line x1="14" y1="38" x2="14" y2="47" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="38" x2="18" y2="47" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="22" y1="38" x2="22" y2="47" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />

    <!-- 3. Operatör Kabini (Cabin with Glass) -->
    <path d="M25 33 L29 18 Q30 16 33 16 L44 16 Q46 16 47 18 L49 33 Z" fill="url(#carbonDark)" stroke="url(#catYellow)" stroke-width="1.5" />
    <!-- Kabin Ön Camı -->
    <path d="M32 19 L42 19 L44 31 L30 31 Z" fill="url(#glassGrad)" />
    <!-- Cam Yansıması -->
    <line x1="34" y1="21" x2="39" y2="29" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- 4. Ana Bom (Main Hydraulic Boom) -->
    <path d="M42 42 L55 22 Q57 19 60 21 L65 24 Q67 26 65 29 L48 48 Z" fill="url(#catYellow)" stroke="#0B0F19" stroke-width="1.2" />
    
    <!-- Bom Hidrolik Pistonu (Hydraulic Cylinder) -->
    <line x1="43" y1="46" x2="57" y2="28" stroke="#0B0F19" stroke-width="3" stroke-linecap="round" />
    <line x1="43" y1="46" x2="54" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

    <!-- 5. Kırıcı/Kazıcı Kol (Arm / Dipper) -->
    <path d="M62 25 L73 38 Q74 40 72 42 L68 44 Q66 43 64 40 L59 28 Z" fill="url(#yellowHighlight)" stroke="#0B0F19" stroke-width="1.2" />
    
    <!-- Kol Pistonu -->
    <line x1="60" y1="24" x2="69" y2="37" stroke="#0B0F19" stroke-width="2.2" stroke-linecap="round" />

    <!-- Bom Bağlantı Pimi (Pivot Pin) -->
    <circle cx="62" cy="26" r="2.2" fill="#0B0F19" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="70" cy="41" r="2.2" fill="#0B0F19" stroke="#FFFFFF" stroke-width="1" />

    <!-- 6. KEPÇE KOVASI (Excavator Bucket with Aggressive Digging Teeth) -->
    <path d="M68 42 L79 46 Q83 50 81 56 L73 60 Q67 61 65 54 L66 45 Z" fill="url(#catYellow)" stroke="#0B0F19" stroke-width="1.5" />
    
    <!-- Kova Güçlendirme Kaburgası -->
    <path d="M69 46 Q76 49 74 56" stroke="#78350F" stroke-width="1.5" fill="none" />

    <!-- Kepçe Dişleri (4 Adet Keskin Kazıcı Tırnak) -->
    <!-- Diş 1 -->
    <polygon points="79,53 84,55 81,57" fill="#0B0F19" />
    <!-- Diş 2 -->
    <polygon points="77,56 82,59 78,60" fill="#0B0F19" />
    <!-- Diş 3 -->
    <polygon points="74,58 78,63 74,62" fill="#0B0F19" />
    <!-- Diş 4 -->
    <polygon points="70,59 73,65 69,63" fill="#0B0F19" />
  </g>

  <!-- ======================================================================
       TİPOGRAFİ VE KURUMSAL MARKA METNİ (X: 96 to 420)
       ====================================================================== -->
  <g id="brand-text" transform="translate(94, 40)">
    <!-- Ana Marka Başlığı -->
    <text font-family="'Barlow', 'Montserrat', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.02em">
      <tspan x="0" y="0" fill="#0B0F19">ADEM </tspan>
      <tspan fill="url(#catYellow)">HAFRİYAT</tspan>
    </text>

    <!-- Endüstriyel Alt Şerit (Tagline Badge) -->
    <g transform="translate(1, 10)">
      <!-- Siyah Zemin Rozeti -->
      <rect x="0" y="0" width="310" height="20" rx="4" fill="#0B0F19" />
      <!-- Sol Küçük Sarı Çizgi Vurgusu -->
      <rect x="0" y="0" width="6" height="20" rx="2" fill="url(#catYellow)" />
      
      <!-- Rozet İçi Metin -->
      <text x="158" y="14" text-anchor="middle" font-family="'Barlow', 'Inter', sans-serif" font-size="11" font-weight="800" fill="#FBBF24" letter-spacing="0.14em">
        YALOVA KEPÇE &amp; FORKLİFT KİRALAMA
      </text>
    </g>
  </g>
</svg>
